<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Otak ! | Pedido</title>
    <link rel="shortcut icon" href="https://i.pinimg.com/736x/fd/39/83/fd3983d0b6974f9a42c6735d27f47358.jpg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="decoracao">
        寿司 お茶 ラーメン 餃子 天ぷら 焼肉 餅 甘味
    </div>

    <img class="overlay left" src="../assets/img/overlay.png" alt="">

    <div class="page" style="position:relative;">
        <div class="asidebackimage"></div>
        <aside style="position:relative; z-index:1;">
            <a href="index.html#inicio"><span>Inicio</span></a>
            <a href="pedido.html"><span>Pedido</span></a>
            <a href="contato.html"><span>Contato</span></a>
        </aside>

        <main>
            <h1 class="logo page-logo"><span>Pedido !!</span></h1>
            <hr>

            <section class="form-page" id="pedido">
                <h2>Endereco de entrega</h2>

                <form action="pedido.html" method="get">
                    <fieldset>
                        <legend>Onde entregar?</legend>

                        <label class="choice">
                            <input type="radio" name="endereco" value="salvo" checked>
                            <span>Usar endereco salvo <small>Centro, Peruibe - SP</small></span>
                        </label>
                        <br>
                        <label class="choice">
                            <input type="radio" name="endereco" value="novo">
                            <span>Adicionar outro endereco <small>Preencha os campos abaixo.</small></span>
                        </label>
                        <br>

                        <div class="map-box">
                            <h3 class="map-title">Usar endereco atual?</h3>
                            <iframe class="map-embed" src="https://www.google.com/maps?q=Centro,%20Peruibe%20-%20SP&output=embed" title="Mapa do centro de Peruibe" loading="lazy"></iframe>
                        </div>
                        <br>

                        <div class="form-grid">
                            <div class="field full">
                                <label for="nome">Nome completo</label>
                                <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Ex.: Auruldo Silva" required>
                            </div>

                            <div class="field full">
                                <label for="rua">Endereco</label>
                                <input id="rua" name="street-address" type="text" autocomplete="street-address" placeholder="Centro, Peruibe - SP" required>
                            </div>

                            <div class="field">
                                <label for="cidade">Cidade</label>
                                <input id="cidade" name="address-level2" type="text" autocomplete="address-level2" placeholder="Cidade" required>
                            </div>

                            <div class="field">
                                <label for="cep">CEP</label>
                                <input id="cep" name="postal-code" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" required>
                            </div>

                            <div class="field">
                                <label for="telefone">Telefone</label>
                                <input id="telefone" name="tel" type="tel" autocomplete="tel" placeholder="11997644602" required>
                            </div>

                            <div class="field">
                                <label for="horario">Horario</label>
                                <input id="horario" name="hora" type="hora" autocomplete="hora" placeholder="Horario" required>
                            </div>

                            <div class="field full">
                                <label for="referencia">Complemento ou referencia</label>
                                <textarea id="referencia" name="referencia" placeholder="Ex.: bloco, apartamento, portao, ponto de referencia"></textarea>
                            </div>
                        </div>
                    </fieldset>

                    <div class="summary">
                        <button type="submit">SALVAR ENDERECO</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
